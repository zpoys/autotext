<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belanja Kuota Autotext</title>
    <style>
      :root {
        font-family: sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
      }

      body {
        position: relative;
      }

      #app {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .wrapper {
        width: 100%;
        height: 100vh;
      }

      .container {
        margin: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .group {
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
      }

      button {
        color: white;
        background-color: #005ae2;
        border: none;
        padding: 0.6rem 0.9rem;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
        border-radius: 8px;
      }

      button:hover {
        background-color: #333 !important;
        transform: translateY(-3px);
      }

      button:active {
        background-color: #555 !important;
        transform: translateY(0);
      }

      .alert {
        background-color: rgba(25, 135, 75, 0.9);
        backdrop-filter: blur(2px);
        border-radius: 5px;
        position: fixed;
        margin: auto;
        z-index: 999;
        top: 1rem;
        right: 1rem;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0.5rem 0.8rem;
        transform: scale(0);
        opacity: 0;
        transition: 0.2s;
      }

      .alert.active {
        opacity: 1;
        transform: scale(1);
      }

      .loader {
        position: relative;
        width: 64px;
        height: 60px;
      }

      .loader::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        background: #acacac;
        width: 64px;
        height: 32px;
        border-radius: 0 0 50px 50px;
        animation: move 0.5s linear infinite alternate;
      }

      .loader::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        background: #0d6efd;
        width: 24px;
        height: 24px;
        transform: translateX(-50%) rotate(0deg);
        animation: rotate 2s linear infinite;
      }

      @keyframes rotate {
        100% {
          transform: translateX(-50%) rotate(360deg);
        }
      }

      @keyframes move {
        0% {
          transform: rotate(10deg);
        }
        100% {
          transform: rotate(-10deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="alert">Copied</div>
    <div id="app"></div>

    <script>
      const app = document.getElementById("app");

      (async () => {
        try {
          app.innerHTML = '<span class="loader"></span>';

          const url =
            "https://script.google.com/macros/s/AKfycbz9Xljd_SIRXIlMP1x1wGfRvuo3w-NiAOvu0O5N4X6MaNvxX7bb4QGj9F0vKTAspWvz/exec";
          const response = await fetch(url);
          const result = await response.json();
          const groups = groupByBreak(result);

          if (groups) {
            app.innerHTML = `
	      <br />
	      <a href="https://docs.google.com/spreadsheets/d/1MeRCBWAjysPcPHay7RpvhKzrGGtIXmB-qNDTGAn_Cxk/edit?gid=0#gid=0" target="_blank">edit data cuy</a>
              <div class="wrapper">
                <div class="container">
                  ${groups
                    .map(
                      (group) => `
                        <div class="group">
                          ${group
                            .map(
                              (data) => {
                                return `
                                  <button data-copy="${data.datacopy}" style="font-size: ${data.fontsize}; background-color: ${data.bgcolor}">
                                    ${data.title}
                                  </button>
                                `
                              }
                            )
                            .join("")}
                        </div>
                      `
                    )
                    .join("")}
                </div>
              </div>
            `;

            const buttons = document.querySelectorAll("button");
            let timeouts = [];

            buttons.forEach((button) => {
              button.addEventListener("click", function () {
                const alert = document.querySelector(".alert");

                alert.classList.remove("active");

                navigator.clipboard.writeText(this.dataset.copy);

                timeouts.forEach((timeout) => {
                  clearTimeout(timeout);
                });

                timeouts = [];

                setTimeout(() => {
                  if (!alert.classList.contains("active")) {
                    alert.classList.add("active");
                  }
                }, 100);

                timeouts.push(
                  setTimeout(() => {
                    alert.classList.remove("active");
                  }, 3000)
                );
              });
            });
          } else {
            throw {
              statusCode: 500,
              message: "Ada kesalahan",
            };
          }
        } catch (error) {
          if (error.statusCode === 500) {
            app.innerHTML = "<h2>Internal Server Error</h2>";
          }

          app.innerHTML = "<h2>GAGAL MENGAMBIL DATA 😢</h2>";
        }
      })();

      function groupByBreak(data) {
        const newData = [];
        let currentGroup = [];

        data.forEach((item) => {
          if (item.title === "break") {
            if (currentGroup.length > 0) {
              newData.push(currentGroup);
            }

            currentGroup = [];
          } else {
            currentGroup.push(item);
          }
        });

        if (currentGroup.length > 0) {
          newData.push(currentGroup);
        }

        return newData;
      }
    </script>
  </body>
</html>
